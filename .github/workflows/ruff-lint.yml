name: Ruff Lint

on:
  pull_request:
    branches:
      - main
  push:
    paths:
      - "src/musubi_tuner/**/*.py"
      - "src/musubi_tuner/**/*.pth"
      - ".python-version"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed Python files
        id: changed-python
        uses: tj-actions/changed-files@v46
        with:
          files: |
            src/musubi_tuner/**/*.py
            src/musubi_tuner/**/*.pth

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: "Install uv"
        if: steps.changed-python.outputs.any_changed == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the project
        if: steps.changed-python.outputs.any_changed == 'true'
        run: uv sync --dev

      - name: "Run Ruff check"
        if: steps.changed-python.outputs.any_changed == 'true'
        run: uv run ruff check --fix ${{ steps.changed-python.outputs.all_changed_files }}

      - name: "Run Ruff format check"
        if: steps.changed-python.outputs.any_changed == 'true'
        run: uv run ruff format --check ${{ steps.changed-python.outputs.all_changed_files }}

      - name: No Python changes to lint
        if: steps.changed-python.outputs.any_changed != 'true'
        run: echo "Skipping Ruff because this push did not change tracked Python files."

      # - name: Minimize uv cache
      #   run: uv cache prune --ci
