name: RunPod Image

on:
  pull_request:
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - ".github/workflows/runpod-image.yml"
      - ".python-version"
      - "README.md"
      - "docs/runpod_template.md"
      - "configs/runpod/**"
      - "pyproject.toml"
      - "src/musubi_tuner/**/*.py"
  push:
    branches:
      - ltx-2
      - ltx-2-dev
      - main
    tags:
      - "v*"
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - ".github/workflows/runpod-image.yml"
      - ".python-version"
      - "README.md"
      - "docs/runpod_template.md"
      - "configs/runpod/**"
      - "pyproject.toml"
      - "src/musubi_tuner/**/*.py"
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize GHCR image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Musubi Tuner RunPod
            org.opencontainers.image.description=RunPod-ready Musubi Tuner image with an LTX 2.3 character I2V LoKR bundle

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
